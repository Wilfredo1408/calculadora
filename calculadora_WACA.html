<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Calc MACRO</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>


  <style>

    /* Paleta de Colores: Greninja Pokemon - Colorida y Alegre */

    :root {

      --fondo:      #0a3d66; /* Azul Greninja vibrante */

      --superficie: #1565a0; /* Azul más alegre */

      --borde:      #ff1493; /* Rosa intenso */

      --acento:     #ff2e7e; /* Rosa hot pink vibrante */

      --acento2:    #00ffff; /* Cyan brillante */

      --texto:      #ffffff; /* Blanco puro */

      --btn-num:    #ffd700; /* Amarillo dorado brillante */

      --btn-txt:    #0a3d66; /* Azul Greninja para contraste */

      --pantalla:   #001a2e; /* Azul muy oscuro para contraste */

    }


    body {

      background: var(--fondo) url('greninja-ash.jpg') no-repeat center center;

      background-size: cover;

      color: var(--texto);

      font-family: 'Nunito', sans-serif;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      margin: 0;

    }


    .calc-card {

      background: var(--superficie);

      border: 1px solid var(--borde);

      border-radius: 28px;

      padding: 25px;

      width: 330px;

      box-shadow: 0 15px 35px rgba(0,0,0,0.6);

    }


    .calc-header {

      font-family: 'Share Tech Mono', monospace;

      color: var(--acento);

      font-size: 0.75rem;

      text-align: center;

      letter-spacing: 2px;

      margin-bottom: 15px;

      text-transform: uppercase;

    }


    /* Pantalla */

    .display-box {

      background: var(--pantalla);

      border: 1px solid var(--borde);

      border-radius: 15px;

      padding: 15px;

      margin-bottom: 20px;

      text-align: right;

    }


    #expresion {

      font-family: 'Share Tech Mono', monospace;

      font-size: 0.8rem;

      color: var(--acento2);

      min-height: 20px;

    }


    #pantalla {

      font-family: 'Share Tech Mono', monospace;

      font-size: 2.4rem;

      color: var(--acento);

      word-wrap: break-word;

      text-shadow: 0 0 10px rgba(0, 245, 212, 0.3);

    }


    /* Teclado */

    .grid-teclado {

      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 12px;

    }


    .btn-calc {

      height: 58px;

      border-radius: 14px;

      border: none;

      font-size: 1.2rem;

      font-weight: 800;

      display: flex;

      align-items: center;

      justify-content: center;

      transition: all 0.1s ease;

      cursor: pointer;

      user-select: none;

    }


    /* Botones Numéricos (CREMITA) */

    .btn-num {

      background: var(--btn-num);

      color: var(--btn-txt);

      box-shadow: 0 4px 0 #ffaa00;

    }


    .btn-num:active {

      transform: translateY(3px);

      box-shadow: 0 1px 0 #ffaa00;

    }


    /* Botones de Operación */

    .btn-op {

      background: #00bfff;

      color: #0a3d66;

      box-shadow: 0 4px 0 #0080c0;

    }


    .btn-op:active {

      transform: translateY(3px);

      box-shadow: 0 1px 0 #0080c0;

    }


    /* Especiales */

    .btn-c {

      background: #ff1493;

      color: #ffffff;

      box-shadow: 0 4px 0 #cc00aa;

    }


    .btn-igual {

      background: var(--acento);

      color: #ffffff;

      grid-column: span 1;

      box-shadow: 0 4px 0 #cc0055;

    }


    .btn-primo {

      grid-column: span 4;

      background: #ff6b35;

      color: #ffffff;

      font-size: 0.9rem;

      height: 48px;

      box-shadow: 0 4px 0 #cc4400;

    }

    .btn-special {

      background: #00ffaa;

      color: #0a3d66;

      box-shadow: 0 4px 0 #00cc88;

    }

    .btn-special:active {

      transform: translateY(3px);

      box-shadow: 0 1px 0 #00cc88;

    }


    .info-footer {

      font-size: 0.7rem;

      text-align: center;

      margin-top: 15px;

      color: #00ffaa;

    }

  </style>

</head>

<body>


  <div class="calc-card">

    <div class="calc-header">Calculadora Greninja</div>

   

    <div class="display-box">

      <div id="expresion"></div>

      <div id="pantalla">0</div>

    </div>


    <div class="grid-teclado">

      <button class="btn-calc btn-c" onclick="limpiar()">C</button>

      <button class="btn-calc btn-op" onclick="borrar()">⌫</button>

      <button class="btn-calc btn-op" onclick="parentesisIzq()">(</button>

      <button class="btn-calc btn-op" onclick="parentesisDer()">)</button>

     

      <button class="btn-calc btn-num" onclick="num('7')"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg" style="width:16px; height:16px; vertical-align:middle; margin-right:2px;">7</button>

      <button class="btn-calc btn-num" onclick="num('8')"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg" style="width:16px; height:16px; vertical-align:middle; margin-right:2px;">8</button>

      <button class="btn-calc btn-num" onclick="num('9')"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg" style="width:16px; height:16px; vertical-align:middle; margin-right:2px;">9</button>

      <button class="btn-calc btn-op" onclick="setOp('*')">×</button>

     

      <button class="btn-calc btn-num" onclick="num('4')"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg" style="width:16px; height:16px; vertical-align:middle; margin-right:2px;">4</button>

      <button class="btn-calc btn-num" onclick="num('5')"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg" style="width:16px; height:16px; vertical-align:middle; margin-right:2px;">5</button>

      <button class="btn-calc btn-num" onclick="num('6')"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg" style="width:16px; height:16px; vertical-align:middle; margin-right:2px;">6</button>

      <button class="btn-calc btn-op" onclick="setOp('/')">÷</button>

     

      <button class="btn-calc btn-num" onclick="num('1')"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg" style="width:16px; height:16px; vertical-align:middle; margin-right:2px;">1</button>

      <button class="btn-calc btn-num" onclick="num('2')"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg" style="width:16px; height:16px; vertical-align:middle; margin-right:2px;">2</button>

      <button class="btn-calc btn-num" onclick="num('3')"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg" style="width:16px; height:16px; vertical-align:middle; margin-right:2px;">3</button>

      <button class="btn-calc btn-op" onclick="setOp('-')">−</button>

     

      <button class="btn-calc btn-num" style="grid-column: span 2;" onclick="num('0')"><img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Pok%C3%A9_Ball_icon.svg" style="width:16px; height:16px; vertical-align:middle; margin-right:2px;">0</button>

      <button class="btn-calc btn-num" onclick="punto()">.</button>

      <button class="btn-calc btn-op" onclick="setOp('+')">+</button>

      <button class="btn-calc btn-igual" onclick="igual()">=</button>


      <button class="btn-calc btn-special" onclick="raizCuadrada()">√</button>

      <button class="btn-calc btn-special" onclick="factorialBtn()">!</button>

      <button class="btn-calc btn-special" onclick="usarAns()">ANS</button>

      <button class="btn-calc btn-special" style="visibility: hidden;"></button>


      <button class="btn-calc btn-primo" onclick="esPrimo()">Verificar Número Primo</button>

    </div>


    <div class="info-footer"> Greninja Calculator </div>

  </div>


  <script>

    let expression = '', reset = false, lastResult = 0;

    const p = document.getElementById('pantalla');

    const e = document.getElementById('expresion');


    function render() {

      p.innerText = expression || '0';

      e.innerText = '';

    }


    function num(n) {

      if(reset) { expression = ''; reset = false; }

      expression += n;

      render();

    }


    function punto() {

      expression += '.';

      render();

    }


    function setOp(o) {

      expression += o;

      render();

    }


    function parentesisIzq() {

      expression += '(';

      render();

    }


    function parentesisDer() {

      expression += ')';

      render();

    }


    function igual() {

      try {

        let res = eval(expression);

        expression = String(res);

        lastResult = res;

        reset = true;

        render();

      } catch {

        p.innerText = 'Error';

      }

    }


    function limpiar() { expression = ''; reset = false; render(); }

   

    function borrar() {

      expression = expression.slice(0,-1);

      render();

    }


    function factorial(n) {

      if(isNaN(n) || n < 0) return 'Error';

      let res = 1;

      for(let i = 2; i <= n; i++) res *= i;

      return res;

    }


    function raizCuadrada() {

      expression = 'Math.sqrt(' + expression + ')';

      render();

    }


    function funcionX() {

      expression = '(' + expression + ') ** 2';

      render();

    }


    function funcionY() {

      expression = '(' + expression + ') ** 3';

      render();

    }


    function funcionZ() {

      expression = '(' + expression + ') ** (1/3)';

      render();

    }


    function factorialBtn() {

      expression = 'factorial(' + expression + ')';

      render();

    }


    function usarAns() {

      if(lastResult === 0) { alert("No hay resultado anterior"); return; }

      expression += String(lastResult);

      render();

    }


    function esPrimo() {

      let n = parseInt(eval(expression));

      if(isNaN(n) || n < 2) { alert("No es primo"); return; }

      for(let i = 2; i <= Math.sqrt(n); i++) {

        if(n % i === 0) { alert(n + " no es primo"); return; }

      }

      alert("✨ " + n + " ¡SÍ es un número primo!");

    }

  </script>


</body>

</html>
